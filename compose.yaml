name: zombie-box-tv
services:
  gateway:
    image: zombie-box-tv/gateway:0.1.0-dev.72
    build:
      context: ${ZOMBIE_CORE_DIR:-../gateway-core}
      dockerfile: ${ZOMBIE_FULL_DIR:-../gateway-full}/Dockerfile
    command:
      [
        "-listen",
        "0.0.0.0:8090",
        "-state",
        "/data/gateway.db",
        "-media-dir",
        "/media",
        "-config",
        "/config/providers.json",
        "-relay-url",
        "http://mediamtx:8888",
        "-relay-control-url",
        "http://mediamtx:9997",
        "-media-tools",
        "-probe-dir",
        "/probes",
        "-threadfin-url",
        "http://threadfin:34400",
      ]
    user: "${ZOMBIE_UID:-1000}:${ZOMBIE_GID:-1000}"
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports:
      - "${ZOMBIE_BIND_IP:-0.0.0.0}:8090:8090"
    environment:
      GOMEMLIMIT: 192MiB
      GOMAXPROCS: "2"
      ZOMBIE_RELAY_ADMIN_TOKEN: "${ZOMBIE_RELAY_ADMIN_TOKEN:?Run make runtime-setup}"
      ZOMBIE_PAIRING_CODE: "${ZOMBIE_PAIRING_CODE:-}"
      ZOMBIE_IPTV_URL: "${ZOMBIE_IPTV_URL:-}"
      ZOMBIE_XMLTV_URL: "${ZOMBIE_XMLTV_URL:-}"
      ZOMBIE_PLEX_TOKEN: "${ZOMBIE_PLEX_TOKEN:-}"
      ZOMBIE_JELLYFIN_TOKEN: "${ZOMBIE_JELLYFIN_TOKEN:-}"
      ZOMBIE_JELLYFIN_USER_ID: "${ZOMBIE_JELLYFIN_USER_ID:-}"
      ZOMBIE_YOUTUBE_OAUTH_CLIENT_ID: "${ZOMBIE_YOUTUBE_OAUTH_CLIENT_ID:-}"
      ZOMBIE_YOUTUBE_OAUTH_CLIENT_SECRET: "${ZOMBIE_YOUTUBE_OAUTH_CLIENT_SECRET:-}"
    volumes:
      - ${ZOMBIE_RUNTIME_ROOT:-.}/.local/gateway/state:/data:Z
      - ${ZOMBIE_RUNTIME_ROOT:-.}/.local/gateway/media:/media:ro,Z
      - ${ZOMBIE_RUNTIME_ROOT:-.}/.local/gateway/probes:/probes:ro,Z
      - ${ZOMBIE_RUNTIME_ROOT:-.}/.local/gateway/config:/config:ro,Z
    mem_limit: 512m
    cpus: 2.0
    pids_limit: 96
    read_only: true
    tmpfs: ["/tmp:size=16777216,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, /zombied, -healthcheck, "http://127.0.0.1:8090"]
      interval: 15s
      timeout: 4s
      retries: 3
    restart: unless-stopped

  discovery:
    image: zombie-box-tv/gateway:0.1.0-dev.60
    network_mode: host
    command:
      [
        "-discovery-only",
        "-discovery-listen",
        "${ZOMBIE_DISCOVERY_BIND_IP:-${ZOMBIE_BIND_IP:-0.0.0.0}}:8098",
        "-discovery-http-port",
        "8090",
      ]
    depends_on:
      gateway:
        condition: service_healthy
    user: "65532:65532"
    mem_limit: 48m
    cpus: 0.25
    pids_limit: 16
    environment:
      GOMEMLIMIT: 24MiB
      GOMAXPROCS: "1"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  youtube:
    profiles: [youtube]
    image: zombie-box-tv/youtube:0.1.0-dev.37
    build:
      context: ${ZOMBIE_CORE_DIR:-../gateway-core}
      dockerfile: wrappers/youtube/Dockerfile
    user: "${ZOMBIE_UID:-1000}:${ZOMBIE_GID:-1000}"
    volumes:
      - ${ZOMBIE_RUNTIME_ROOT:-.}/.local/youtube:/config:ro,Z
    expose: [8091]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 32
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:8091/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 4s
      retries: 3
    restart: unless-stopped

  youtube-receiver:
    profiles: [youtube-receiver]
    image: zombie-box-tv/youtube-receiver:0.1.0-dev.37
    build:
      context: ${ZOMBIE_CORE_DIR:-../gateway-core}
      dockerfile: wrappers/youtube-receiver/Dockerfile
    network_mode: host
    user: "${ZOMBIE_UID:-1000}:${ZOMBIE_GID:-1000}"
    volumes:
      - ${ZOMBIE_RUNTIME_ROOT:-.}/.local/youtube-receiver:/config:ro,Z
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 48
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "on-failure:5"

  spotify:
    profiles: [spotify]
    image: zombie-box-tv/spotify:0.1.0-dev.71
    build:
      context: ${ZOMBIE_CORE_DIR:-../gateway-core}
      dockerfile: wrappers/spotify/Dockerfile
      additional_contexts:
        sources: ${ZOMBIE_RUNTIME_ROOT:-.}/.local/build-sources
    # Spotify Connect mDNS and the pairing TCP listener must see the real LAN.
    network_mode: host
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      ZOMBIE_SPOTIFY_API_BIND: host.docker.internal:8092
    user: "${ZOMBIE_UID:-1000}:${ZOMBIE_GID:-1000}"
    volumes:
      - ${ZOMBIE_RUNTIME_ROOT:-.}/.local/spotify/worker.json:/config/worker.json:ro,Z
      - ${ZOMBIE_RUNTIME_ROOT:-.}/.local/spotify/state:/state:Z
    mem_limit: 320m
    cpus: 1.0
    pids_limit: 48
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Device authorization codes expire; keep offering a fresh pairing attempt.
    restart: unless-stopped

  airplay:
    profiles: [airplay]
    image: zombie-box-tv/airplay:0.1.0-dev.37
    build:
      context: ${ZOMBIE_CORE_DIR:-../gateway-core}
      dockerfile: wrappers/airplay/Dockerfile
      additional_contexts:
        sources: ${ZOMBIE_RUNTIME_ROOT:-.}/.local/build-sources
    network_mode: host
    user: "${ZOMBIE_UID:-1000}:${ZOMBIE_GID:-1000}"
    volumes:
      - ${ZOMBIE_RUNTIME_ROOT:-.}/.local/airplay/worker.json:/config/worker.json:ro,Z
      - ${ZOMBIE_RUNTIME_ROOT:-.}/.local/airplay/state:/state:Z
    mem_limit: 512m
    cpus: 2.0
    pids_limit: 64
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "on-failure:5"

  threadfin:
    profiles: [threadfin]
    image: zombie-box-tv/threadfin:0.1.0-dev.37
    build:
      context: ${ZOMBIE_CORE_DIR:-../gateway-core}
      dockerfile: wrappers/threadfin/Dockerfile
      additional_contexts:
        sources: ${ZOMBIE_RUNTIME_ROOT:-.}/.local/build-sources
    user: "${ZOMBIE_UID:-1000}:${ZOMBIE_GID:-1000}"
    ports: ["127.0.0.1:34400:34400"]
    volumes:
      - ${ZOMBIE_RUNTIME_ROOT:-.}/.local/threadfin:/state:Z
    tmpfs: ["/tmp:size=67108864,mode=1777"]
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 48
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "on-failure:5"

  rebrowser:
    profiles: [rebrowser]
    image: zombie-box-tv/rebrowser:0.1.0-dev.37
    build:
      context: ${ZOMBIE_CORE_DIR:-../gateway-core}
      dockerfile: wrappers/rebrowser/Dockerfile
    user: "${ZOMBIE_UID:-1000}:${ZOMBIE_GID:-1000}"
    init: true
    volumes:
      - ${ZOMBIE_RUNTIME_ROOT:-.}/.local/rebrowser/browser.json:/config/browser.json:ro,Z
    tmpfs: ["/tmp:size=134217728,mode=1777"]
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 128
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=${ZOMBIE_CORE_DIR:-../gateway-core}/wrappers/rebrowser/seccomp_profile.json
    restart: "on-failure:5"

  mediamtx:
    image: bluenviron/mediamtx:1.21.1@sha256:dc22a8b09668e7f5b493cfa848c395349ad16fd47fef1cc7b7eb5b87a1186232
    user: "${ZOMBIE_UID:-1000}:${ZOMBIE_GID:-1000}"
    ports:
      - "${ZOMBIE_RTSP_BIND_IP:-${ZOMBIE_BIND_IP:-0.0.0.0}}:8554:8554"
    environment:
      MTX_AUTHHTTPADDRESS: "http://gateway:8090/internal/relay/auth?key=${ZOMBIE_RELAY_ADMIN_TOKEN:?Run make runtime-setup}"
      GOMEMLIMIT: 96MiB
      GOMAXPROCS: "1"
    volumes:
      - ${ZOMBIE_CORE_DIR:-../gateway-core}/wrappers/mediamtx/mediamtx.yml:/mediamtx.yml:ro,Z
    mem_limit: 160m
    cpus: 1.0
    pids_limit: 32
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
