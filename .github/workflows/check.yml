name: Component checks
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install the pinned Compose verifier
        run: |
          mkdir -p "$HOME/.docker/cli-plugins"
          curl --fail --location --silent --show-error \
            https://github.com/docker/compose/releases/download/v5.5.1/docker-compose-linux-x86_64 \
            -o "$HOME/.docker/cli-plugins/docker-compose"
          echo "db1889184726840f75c4f9c001048430d4f25b3be3cb084d3ddd762bc0aed576  $HOME/.docker/cli-plugins/docker-compose" | sha256sum --check
          chmod +x "$HOME/.docker/cli-plugins/docker-compose"
          docker compose version
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.25.6"
          cache: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.22.2"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: "0.10.0"
      - run: make format-check
      - run: make deps deps-check
      - run: bash scripts/prepare-ci-media.sh
      - run: make check build
